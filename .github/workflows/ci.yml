# Regression gate: runs on every push / PR. Backend unit+integration tests,
# frontend typecheck + build, then the Playwright smoke/sanity/regression/
# security suite against the built frontend with a mocked API.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit -p .
      - run: npx jest --ci

  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: cd frontend && npx tsc --noEmit -p .
      - run: npm run build
      - run: cd e2e && npm install && npx playwright install --with-deps chromium
      - run: cd e2e && npx playwright test
        env: { PW_CHROMIUM: '' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: e2e/report }
