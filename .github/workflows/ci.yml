# Regression gate: runs on every push / PR
# Checks: both deployment roots, TypeScript/builds, and legacy schema preservation
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  root-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://fixture:fixture@localhost:5432/fixture
      VITE_API_URL: https://example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install the root Railway dependency tree
        run: bun install --frozen-lockfile
      - name: Build root deployment and generate its database client
        run: npm run build
      - name: Verify root runtime imports and generated models without connecting
        run: node scripts/check-root-runtime.mjs
      - name: Verify web deployment starts without backend secrets or database
        run: node scripts/check-frontend-runtime.mjs

  deployment-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deployment_fixture
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deployment_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Reproduce the deployed pre-PR9 schema and 113 legacy positions
        run: |
          git show 7a053640af03ae5d6b53e14cf85aeca8715095df:backend/prisma/schema.prisma > /tmp/legacy-schema.prisma
          npx prisma db push --schema=/tmp/legacy-schema.prisma --skip-generate
          npx prisma generate --schema=./prisma/schema.prisma
          node tests/deploymentCompatibility.integration.cjs seed
      - name: Confirm the original deployment failure is reproduced
        run: |
          git show 2661f9b149733e2fcc42438e6c70538947aacdab:backend/prisma/schema.prisma > /tmp/broken-schema.prisma
          if npx prisma db push --schema=/tmp/broken-schema.prisma --skip-generate > /tmp/original-failure.log 2>&1; then
            echo 'Expected the original required-scopeKey migration to fail.'
            exit 1
          fi
          grep -q 'scopeKey' /tmp/original-failure.log
          grep -q '113' /tmp/original-failure.log
      - name: Run the actual Railway schema command twice and verify preservation
        run: |
          npm run deploy:schema
          npm run deploy:schema
          node tests/deploymentCompatibility.integration.cjs verify
      - name: Verify prediction claim concurrency on disposable PostgreSQL
        env:
          RUN_PREDICTION_POSTGRES_TESTS: 'true'
        run: npx jest --runInBand --runTestsByPath tests/predictionExecution.postgres.integration.test.ts

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit -p .
      - name: Verify owner-only private chat and activity feed isolation with mocked providers
        run: npx jest --runInBand --runTestsByPath tests/chat.privateAccess.test.ts
      - name: Verify provider completion, structured acceptance and cancellation contracts
        run: npx jest --runInBand --runTestsByPath tests/llmCompletion.test.ts tests/llmCancellation.test.ts tests/platformUpgrade.test.ts
      - name: Verify prediction execution and account contracts with mocked providers
        run: npx jest --runInBand --runTestsByPath tests/predictionExecution.authority.test.ts tests/predictionExecution.plan.test.ts tests/predictionOrderEvidence.test.ts tests/polymarketUSRest.test.ts tests/polymarketUSExecution.test.ts tests/polymarketUS.marketData.test.ts tests/polymarketUSAccount.test.ts
      - name: Verify legacy execution refusal and actual scheduled paper status
        run: npx jest --runInBand --runTestsByPath tests/polymarketGreed.route.test.ts tests/polymarketMoneyGreed.retirement.test.ts tests/polymarketRuntime.test.ts
      - name: Verify incomplete company evidence cannot crash committee prompts
        run: npx jest --runInBand --runTestsByPath tests/deepAnalysis.formatting.test.ts tests/debateEngine.technicianGrounding.test.ts tests/debateEngine.regimeLessons.test.ts
      - name: Verify research cannot authorize an order and entry decisions retain their authority
        run: npx jest --runInBand --runTestsByPath tests/committee.behavior.test.ts tests/decisionAuthority.test.ts tests/scheduler.tradeExecuted.test.ts
      - name: Verify owner-only socket admission, expiry and revocation with mocked transports
        run: npx jest --runInBand --runTestsByPath tests/ownerSocketSession.test.ts
      - name: Verify market panels cannot invent financial observations
        run: npx jest --runInBand --runTestsByPath tests/dashboardMarketEvidence.test.ts
      - name: Verify authenticated research service contracts with mocked services
        run: npx jest --runInBand --runTestsByPath tests/researchServices.test.ts

  private-runtime-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare dependencies and generated types
        working-directory: backend
        env:
          DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:5432/fixture
        run: |
          npm install
          npx prisma generate
      - name: Prepare offline compiler runtime
        run: docker pull node:22-bookworm-slim
      - name: Typecheck and verify private REST guards without network or services
        run: >-
          timeout --signal=KILL 270s docker run --rm --pull=never
          --network none --read-only --cap-drop ALL --security-opt no-new-privileges
          --pids-limit 64 --memory 2g --cpus 1 --ulimit fsize=67108864:67108864
          --user 65534:65534 --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777
          --mount type=bind,src=${{ github.workspace }}/backend,dst=/source,readonly
          --workdir /source --entrypoint /usr/bin/env node:22-bookworm-slim
          -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/tmp TMPDIR=/tmp NODE_ENV=test
          DATABASE_URL=postgresql://fixture:fixture@127.0.0.1:5432/fixture
          /usr/bin/timeout --signal=KILL 240s /bin/sh -c 'node node_modules/typescript/bin/tsc -p tsconfig.private-runtime-tests.json && node node_modules/jest/bin/jest.js --runInBand --cacheDirectory=/tmp/jest --runTestsByPath tests/privateRuntimeRoutes.test.ts'

  research-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify request, quota and scenario contracts in isolated loopback container
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --pids-limit 64 --memory 1g --cpus 1
          --user 65534:65534 --tmpfs /tmp:rw,nosuid,nodev,size=128m,mode=1777
          --env HOME=/tmp --env TMPDIR=/tmp --env PYTHONDONTWRITEBYTECODE=1
          --mount type=bind,src=${{ github.workspace }}/integrations/research,dst=/source,readonly
          python:3.12.12-slim-bookworm python -B -m unittest discover -s /source/tests -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build (TypeScript + Vite)
        run: npm run build
      - name: Verify real freshness markup, chart links and interleaved debate evidence
        run: node --test tests/experienceContracts.cjs tests/marketPanels.cjs
      - name: Verify authentication session query isolation and late response cancellation
        timeout-minutes: 2
        run: node --test tests/sessionQueryIsolation.cjs
