name: Observed team session contracts
on:
  pull_request:
  push:
    branches: [main]
jobs:
  deployment-workflow-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned workflow validator
        run: docker pull rhysd/actionlint:1.7.12
      - name: Validate deployment expressions without network or deployment credentials
        run: >-
          timeout --signal=KILL 60s docker run --rm --pull=never
          --network none --read-only --cap-drop ALL --security-opt no-new-privileges
          --pids-limit 32 --memory 256m --cpus 1 --ulimit fsize=1048576:1048576
          --user 65534:65534 --tmpfs /tmp:rw,nosuid,nodev,size=16m,mode=1777
          --env HOME=/tmp --env TMPDIR=/tmp
          --mount type=bind,src=${{ github.workspace }}/.github/workflows,dst=/workflows,readonly
          rhysd/actionlint:1.7.12 -shellcheck= -pyflakes= /workflows/deploy.yml
  team-session-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare dependencies and generated types
        working-directory: backend
        env:
          DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:5432/fixture
        run: |
          npm install
          npx prisma generate
      - name: Prepare offline runtime
        run: docker pull node:22-bookworm-slim
      - name: Typecheck and verify actual committee observations and current-owner readback offline
        run: >-
          timeout --signal=KILL 270s docker run --rm --pull=never
          --network none --read-only --cap-drop ALL --security-opt no-new-privileges
          --pids-limit 64 --memory 2g --cpus 1 --ulimit fsize=67108864:67108864
          --user 65534:65534 --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777
          --mount type=bind,src=${{ github.workspace }}/backend,dst=/source,readonly
          --workdir /source --entrypoint /usr/bin/env node:22-bookworm-slim
          -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/tmp TMPDIR=/tmp NODE_ENV=test
          DATABASE_URL=postgresql://fixture:fixture@127.0.0.1:5432/fixture
          /usr/bin/timeout --signal=KILL 240s /bin/sh -c 'node node_modules/typescript/bin/tsc -p tsconfig.team-session-tests.json && node node_modules/jest/bin/jest.js --runInBand --cacheDirectory=/tmp/jest --runTestsByPath tests/teamSessions.test.ts tests/teamSessions.route.test.ts tests/committee.behavior.test.ts tests/privateRuntimeRoutes.test.ts'
