name: Scheduler runtime evidence

on:
  push:
    branches: [main, codex/scheduler-runtime-evidence]
  pull_request:

permissions:
  contents: read

jobs:
  scheduler-runtime-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare dependencies and generated types
        working-directory: backend
        env:
          DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:5432/fixture
        run: |
          npm install
          npx prisma generate
      - name: Prepare offline compiler runtime
        run: docker pull node:22-bookworm-slim
      - name: Prepare frontend dependencies before isolation
        working-directory: frontend
        run: npm install
      - name: Verify scheduler lifecycle, real callback boundaries and owner-only status offline
        run: >-
          timeout --signal=KILL 270s docker run --rm --pull=never
          --network none --read-only --cap-drop ALL --security-opt no-new-privileges
          --pids-limit 64 --memory 2g --cpus 1 --ulimit fsize=67108864:67108864
          --user 65534:65534 --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777
          --mount type=bind,src=${{ github.workspace }}/backend,dst=/source,readonly
          --workdir /source --entrypoint /usr/bin/env node:22-bookworm-slim
          -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/tmp TMPDIR=/tmp NODE_ENV=test
          DATABASE_URL=postgresql://fixture:fixture@127.0.0.1:5432/fixture
          /usr/bin/timeout --signal=KILL 240s /bin/sh -c 'node node_modules/typescript/bin/tsc -p tsconfig.scheduler-runtime-tests.json && node node_modules/jest/bin/jest.js --runInBand --cacheDirectory=/tmp/jest --runTestsByPath tests/schedulerRuntime.test.ts tests/schedulerInstrumentation.test.ts tests/scheduler.tradeExecuted.test.ts tests/privateRuntimeRoutes.test.ts'
      - name: Verify user-facing heartbeat labels without network or services
        run: >-
          timeout --signal=KILL 150s docker run --rm --pull=never
          --network none --read-only --cap-drop ALL --security-opt no-new-privileges
          --pids-limit 64 --memory 2g --cpus 1 --ulimit fsize=67108864:67108864
          --user 65534:65534 --tmpfs /tmp:rw,nosuid,nodev,size=128m,mode=1777
          --mount type=bind,src=${{ github.workspace }}/frontend,dst=/source,readonly
          --workdir /source --entrypoint /usr/bin/env node:22-bookworm-slim
          -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/tmp TMPDIR=/tmp NODE_ENV=test
          /usr/bin/timeout --signal=KILL 120s /bin/sh -c 'node node_modules/typescript/bin/tsc --noEmit && node --test tests/schedulerPresentation.cjs'
