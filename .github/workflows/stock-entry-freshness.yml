name: Stock entry freshness
on:
  pull_request:
  push:
    branches: [main, codex/stock-entry-freshness]
permissions:
  contents: read
jobs:
  stock-entry-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare dependencies and generated types
        working-directory: backend
        env:
          DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:5432/fixture
        run: |
          npm install
          npx prisma generate
      - name: Prepare isolated runtime
        run: docker pull node:22-bookworm-slim
      - name: Verify actual entry guards with mocked accounts and providers offline
        run: >-
          timeout --signal=KILL 330s docker run --rm --pull=never
          --network none --read-only --cap-drop ALL --security-opt no-new-privileges
          --pids-limit 64 --memory 2g --cpus 1 --ulimit fsize=67108864:67108864
          --ulimit nofile=512:512 --user 65534:65534
          --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777
          --mount type=bind,src=${{ github.workspace }}/backend,dst=/source,readonly
          --workdir /source --entrypoint /usr/bin/env node:22-bookworm-slim
          -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/tmp TMPDIR=/tmp NODE_ENV=test
          DATABASE_URL=postgresql://fixture:fixture@127.0.0.1:5432/fixture
          /usr/bin/timeout --signal=KILL 300s /bin/sh -c 'node node_modules/typescript/bin/tsc -p tsconfig.stock-entry-tests.json && node node_modules/jest/bin/jest.js --runInBand --cacheDirectory=/tmp/jest --runTestsByPath tests/stockEntryEvidence.test.ts tests/decisionAuthority.test.ts tests/executionAuthority.behavior.test.ts tests/committee.behavior.test.ts tests/executionEngine.safety.test.ts tests/debateEngine.sentiment.test.ts tests/intradayAccountScope.test.ts tests/liveGate.test.ts tests/accountManager.persistence.test.ts'
