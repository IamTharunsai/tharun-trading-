name: Team workspace readback contracts
on:
  pull_request:
  push:
    branches: [main]
jobs:
  team-workspace-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Prepare offline runtime
        run: docker pull node:22-bookworm-slim
      - name: Typecheck and verify actual readback adapter, query and rendered hook boundaries offline
        run: >-
          timeout --signal=KILL 210s docker run --rm --pull=never
          --network none --read-only --cap-drop ALL --security-opt no-new-privileges
          --pids-limit 64 --memory 2g --cpus 1 --ulimit fsize=67108864:67108864
          --user 65534:65534 --tmpfs /tmp:rw,nosuid,nodev,size=128m,mode=1777
          --mount type=bind,src=${{ github.workspace }}/frontend,dst=/source/frontend,readonly
          --mount type=bind,src=${{ github.workspace }}/backend/src/services/teamSessions.ts,dst=/source/backend/src/services/teamSessions.ts,readonly
          --workdir /source/frontend --entrypoint /usr/bin/env node:22-bookworm-slim
          -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/tmp TMPDIR=/tmp NODE_ENV=test
          /usr/bin/timeout --signal=KILL 180s /bin/sh -c 'node node_modules/typescript/bin/tsc --noEmit -p tsconfig.json && node --test tests/teamWorkspaceReadback.cjs tests/sessionIntegrity.cjs tests/sessionQueryIsolation.cjs'
