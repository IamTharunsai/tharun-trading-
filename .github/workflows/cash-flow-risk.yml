name: Cash flow loss accounting
on:
  pull_request:
  push:
    branches: [codex/cash-flow-loss-controls]
permissions:
  contents: read
jobs:
  cash-flow-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare dependencies and generated database types
        working-directory: backend
        env:
          DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:5432/fixture
        run: |
          npm install
          npx prisma generate
      - name: Prepare offline runtime
        run: docker pull node:22-bookworm
      - name: Typecheck and verify accounting against mocked broker evidence offline
        run: >-
          timeout --signal=KILL 330s docker run --rm --pull=never
          --network none --read-only --cap-drop ALL --security-opt no-new-privileges
          --pids-limit 64 --memory 2g --cpus 1 --ulimit fsize=67108864:67108864
          --ulimit nofile=512:512 --user 65534:65534
          --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777
          --mount type=bind,src=${{ github.workspace }}/backend,dst=/source,readonly
          --workdir /source --entrypoint /usr/bin/env node:22-bookworm
          -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/tmp TMPDIR=/tmp NODE_ENV=test
          DATABASE_URL=postgresql://fixture:fixture@127.0.0.1:5432/fixture
          /usr/bin/timeout --signal=KILL 300s /bin/sh -c 'node node_modules/typescript/bin/tsc -p tsconfig.cash-flow-tests.json && node node_modules/jest/bin/jest.js --runInBand --cacheDirectory=/tmp/jest --runTestsByPath tests/capitalActivityHistory.test.ts tests/cashFlowRisk.test.ts tests/cashFlowRisk.contract.test.ts tests/portfolio.evidence.test.ts tests/portfolio.test.ts tests/portfolio.weeklyPnl.test.ts'
  cash-flow-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare dependencies, types and previous schema fixture
        working-directory: backend
        env:
          DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:5432/fixture
        run: |
          npm install
          npx prisma generate
          git show b4f44af73da4006fdcd9d5c46bb2040e4243219b:backend/prisma/schema.prisma > prisma/ci-previous-schema.prisma
      - name: Prepare offline database and compiler runtimes
        run: |
          docker pull node:22-bookworm
          docker pull postgres:16-bookworm
      - name: Start disposable PostgreSQL in its own isolated loopback namespace
        run: |
          docker run --detach --name cash-flow-db --pull=never --network none \
          --read-only --cap-drop ALL --security-opt no-new-privileges \
          --pids-limit 128 --memory 1g --cpus 1 --ulimit fsize=268435456:268435456 \
          --user 999:999 --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 \
          --tmpfs /var/run/postgresql:rw,nosuid,nodev,size=16m,uid=999,gid=999 \
          --tmpfs /var/lib/postgresql/data:rw,nosuid,nodev,size=768m,uid=999,gid=999,mode=0700 \
          --env POSTGRES_USER=fixture --env POSTGRES_PASSWORD=fixture --env POSTGRES_DB=fixture \
          postgres:16-bookworm postgres -c listen_addresses=127.0.0.1 -c max_connections=20 -c shared_buffers=32MB -c max_wal_size=128MB
          for attempt in $(seq 1 30); do
            if docker exec cash-flow-db pg_isready -h 127.0.0.1 -U fixture -d fixture >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify additive rollout and real database concurrency without external network
        run: >-
          timeout --signal=KILL 330s docker run --rm --pull=never
          --network container:cash-flow-db --read-only --cap-drop ALL --security-opt no-new-privileges
          --pids-limit 64 --memory 2g --cpus 1 --ulimit fsize=67108864:67108864
          --ulimit nofile=512:512 --user 65534:65534
          --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777
          --mount type=bind,src=${{ github.workspace }}/backend,dst=/source,readonly
          --workdir /source --entrypoint /usr/bin/env node:22-bookworm
          -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/tmp TMPDIR=/tmp NODE_ENV=test
          DATABASE_URL=postgresql://fixture:fixture@127.0.0.1:5432/fixture RUN_CASH_FLOW_POSTGRES=true
          /usr/bin/timeout --signal=KILL 300s /bin/sh -c 'node node_modules/prisma/build/index.js db push --schema=prisma/ci-previous-schema.prisma --skip-generate && node tests/cashFlowRisk.rollout.cjs seed && node node_modules/prisma/build/index.js db execute --file=prisma/migrations/20261016190000_cash_flow_risk/migration.sql --schema=prisma/schema.prisma && node node_modules/prisma/build/index.js db execute --file=prisma/deploy-compat.sql --schema=prisma/schema.prisma && node node_modules/prisma/build/index.js db execute --file=prisma/migrations/20261021150000_capital_activity_coverage/migration.sql --schema=prisma/schema.prisma && node node_modules/prisma/build/index.js db execute --file=prisma/migrations/20261021150000_capital_activity_coverage/migration.sql --schema=prisma/schema.prisma && node node_modules/prisma/build/index.js db push --schema=prisma/schema.prisma --skip-generate && node node_modules/prisma/build/index.js db push --schema=prisma/schema.prisma --skip-generate && node tests/cashFlowRisk.rollout.cjs verify && node node_modules/jest/bin/jest.js --runInBand --cacheDirectory=/tmp/jest --runTestsByPath tests/cashFlowRisk.postgres.integration.test.ts'
      - name: Remove disposable database
        if: always()
        run: docker rm -f cash-flow-db >/dev/null 2>&1 || true
