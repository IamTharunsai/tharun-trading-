name: Rainlight Commons visual proof
on:
  pull_request:
  push:
    branches: [main]
jobs:
  rainlight-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare dependencies
        working-directory: frontend
        run: |
          npm install
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.64.0
      - name: Prepare isolated browser runtime and proof directory
        run: |
          docker pull mcr.microsoft.com/playwright:v1.64.0-noble
          mkdir -p "$RUNNER_TEMP/rainlight-proof"
          chmod 777 "$RUNNER_TEMP/rainlight-proof"
      - name: Build and render only local architecture assets without network access
        run: >-
          timeout --signal=KILL 300s docker run --rm --init --pull=never
          --network none --read-only --cap-drop ALL --security-opt no-new-privileges
          --pids-limit 128 --memory 2g --cpus 2 --ulimit fsize=10485760:10485760
          --user 1000:1000 --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777
          --mount type=bind,src=${{ github.workspace }},dst=/source,readonly
          --mount type=bind,src=${{ runner.temp }}/rainlight-proof,dst=/output
          --workdir /source/frontend --entrypoint /usr/bin/env mcr.microsoft.com/playwright:v1.64.0-noble
          -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/tmp TMPDIR=/tmp NODE_ENV=test
          PLAYWRIGHT_BROWSERS_PATH=/ms-playwright SOURCE_COMMIT=${{ github.sha }}
          /usr/bin/timeout --signal=KILL 270s /bin/sh -c 'node node_modules/typescript/bin/tsc --noEmit && node node_modules/vite/bin/vite.js build --config vite.visual.config.ts --outDir /tmp/commons-dist && node tests/visual/capture.cjs'
      - name: Preserve exact-head visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rainlight-visual-${{ github.sha }}
          path: ${{ runner.temp }}/rainlight-proof
          if-no-files-found: error
          retention-days: 14
