name: Stock snapshot evidence
on:
  pull_request:
  push:
    branches: [main, codex/grounded-market-research-screens]
permissions:
  contents: read
jobs:
  stock-snapshot-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare dependencies, types and pinned pre-repair source
        working-directory: backend
        env:
          DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:5432/fixture
        run: |
          npm install
          npx prisma generate
          git show 1c0f0bd93a2c56ba210e9fc8196ecf2eb23ff264:backend/src/services/marketData.ts > "$RUNNER_TEMP/pre-repair-marketData.ts"
      - name: Prepare isolated runtime
        run: docker pull node:22-bookworm-slim
      - name: Reproduce missing stock snapshot then verify real observed data contracts offline
        run: >-
          timeout --signal=KILL 330s docker run --rm --pull=never
          --network none --read-only --cap-drop ALL --security-opt no-new-privileges
          --pids-limit 64 --memory 2g --cpus 1 --ulimit fsize=67108864:67108864
          --ulimit nofile=512:512 --user 65534:65534
          --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777
          --mount type=bind,src=${{ github.workspace }}/backend,dst=/source,readonly
          --mount type=bind,src=${{ runner.temp }}/pre-repair-marketData.ts,dst=/baseline-marketData.ts,readonly
          --workdir /source --entrypoint /usr/bin/env node:22-bookworm-slim
          -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/tmp TMPDIR=/tmp NODE_ENV=test
          DATABASE_URL=postgresql://fixture:fixture@127.0.0.1:5432/fixture
          /usr/bin/timeout --signal=KILL 300s /bin/sh -c '
          set -eu;
          node node_modules/typescript/bin/tsc -p tsconfig.market-snapshot-tests.json;
          mkdir -p /tmp/baseline/tests;
          cp -R src /tmp/baseline/src;
          cp /baseline-marketData.ts /tmp/baseline/src/services/marketData.ts;
          cp tests/stockSnapshotEvidence.test.ts /tmp/baseline/tests/;
          cp jest.config.js tsconfig.json /tmp/baseline/;
          ln -s /source/node_modules /tmp/baseline/node_modules;
          if node node_modules/jest/bin/jest.js --config=/tmp/baseline/jest.config.js --runInBand --cacheDirectory=/tmp/red-jest --runTestsByPath /tmp/baseline/tests/stockSnapshotEvidence.test.ts --testNamePattern=newly > /tmp/baseline-result.log 2>&1; then
            echo Pre-repair source unexpectedly passed the missing-snapshot reproduction; exit 1;
          fi;
          grep -q "Received has value: null" /tmp/baseline-result.log;
          grep -q "1 failed" /tmp/baseline-result.log;
          echo Confirmed pinned pre-repair source returned null for an uncached stock with available provider evidence;
          cd /tmp;
          node /source/node_modules/jest/bin/jest.js --config=/source/jest.config.js --runInBand --cacheDirectory=/tmp/green-jest --runTestsByPath /source/tests/stockSnapshotEvidence.test.ts /source/tests/marketData.indicators.test.ts /source/tests/debateEngine.technicianGrounding.test.ts /source/tests/debateEngine.regimeLessons.test.ts'
