[phases.setup]
nixPkgs = ["python311"]

[phases.install]
# nix's system Python is PEP 668 "externally-managed" -- pip (even via
# ensurepip) refuses to install directly into it. A venv is never externally
# managed, so create one explicitly and use its pip/python from here on.
cmds = [
  "python3 -m venv /opt/venv",
  "/opt/venv/bin/pip install -r requirements.txt"
]

[start]
cmd = "/opt/venv/bin/python app.py"
