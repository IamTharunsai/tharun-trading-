[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
# --include=dev forces devDependencies (typescript, prisma, etc.) to install
# even when NODE_ENV=production is set in the build environment — without
# this, npm intermittently skips them depending on cache state, which is why
# `tsc` was "not found" 3 times tonight under 3 different invocation styles
# (npx, bare, direct-path) — the invocation was never the problem.
cmds = ["npm install --include=dev"]

[phases.build]
cmds = [
  "npx prisma generate --schema=./prisma/schema.prisma",
  "npm run build"
]

[start]
cmd = "npx prisma db push --schema=./prisma/schema.prisma --accept-data-loss && node dist/index.js"
