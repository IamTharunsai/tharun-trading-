[phases.setup]
# node:sqlite (the real datastore, utils/prisma.ts) needs Node >= 22.5
nixPkgs = ["nodejs_22"]

[phases.install]
# --include=dev forces devDependencies (typescript, prisma, etc.) to install
# even when NODE_ENV=production is set in the build environment — without
# this, npm intermittently skips them depending on cache state, which is why
# `tsc` was "not found" 3 times tonight under 3 different invocation styles
# (npx, bare, direct-path) — the invocation was never the problem.
cmds = ["npm install --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
# The app does NOT use Prisma/Postgres at runtime (utils/prisma.ts is a SQLite
# layer). `prisma db push --accept-data-loss` only risked wiping a database.
# Mount a Railway volume and set SQLITE_DB_PATH=/data/apex_trading.db so data
# survives redeploys.
cmd = "node dist/index.js"
